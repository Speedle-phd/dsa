<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSA5 Hero Sheets</title>
    <script>
      // Theme before the first paint (same key as src/theme/themeStore.ts), so dark mode doesn't flash light.
      try {
        var stored = JSON.parse(localStorage.getItem('dsa5.theme') || '{}')
        var theme = (stored.state && stored.state.theme) || 'system'
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
