<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSA5 Hero Sheets</title>
    <script>
      // Theme before the first paint (same key and themes as src/theme/themeStore.ts and themes.ts), so nothing flashes.
      try {
        var stored = JSON.parse(localStorage.getItem('dsa5.theme') || '{}')
        var theme = (stored.state && stored.state.theme) || 'system'
        if (theme === 'system') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        var modes = { light: 'light', dark: 'dark', parchment: 'light', ember: 'dark' }
        var mode = modes[theme] || 'light'
        document.documentElement.classList.toggle('dark', mode === 'dark')
        if (theme === 'parchment' || theme === 'ember') document.documentElement.classList.add('theme-' + theme)
        document.documentElement.style.colorScheme = mode
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
