# Production stack (default): `docker compose up -d --build`
#   client: built app served by nginx on http://localhost:${APP_PORT:-8080}; nginx proxies /api to the server
#   server: bundled Express API (node, NODE_ENV=production), only reachable inside the compose network
#   mongo:  MongoDB 8, data in the mongo_data volume
#
# Development (Vite + tsx watch, hot reload) adds compose.dev.yml:
#   docker compose -f compose.yml -f compose.dev.yml up -d --build

services:
  client:
    image: dsa-client:prod
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    networks:
      rmgserver:
        ipv4_address: 192.168.102.23
      docker-default:

  server:
    image: dsa-server:prod
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # nginx in front: take the client IP from X-Forwarded-For (rate limits per user, not per proxy).
      TRUST_PROXY: 1
      MONGO_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE:-dsa}?authSource=admin"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/hello"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
        - docker-default
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MongoDB username in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MongoDB password in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-dsa}
    volumes:
      - mongo_data:/data/db
    networks:
        - docker-default
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - ${MONGO_INITDB_ROOT_USERNAME}
        - --password
        - ${MONGO_INITDB_ROOT_PASSWORD}
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  client_node_modules:
  server_node_modules:
  mongo_data:

networks:
    docker-default:
      external: true
      name: docker-default
    rmgserver:
      external: true
      name: vlan102_macvlan
